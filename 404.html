<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidan finns inte · Remissnissen</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><meta name="robots" content="noindex">
<style>
:root{--bg:#fff4ef;--card:#fff;--ink:#3b2a4a;--muted:#5d4a6e;--line:#f6d6cb;--accent:#e8386d}
@media (prefers-color-scheme:dark){:root{--bg:#221a2e;--card:#2d2240;--ink:#fdeef3;--muted:#dcc6d6;--line:#4b3b62;--accent:#ff7da2}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:460px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:32px 24px}
img{width:96px;height:96px;border-radius:50%}
h1{font-size:1.6rem;margin:.4em 0 .2em}p{color:var(--muted)}
a{display:inline-block;margin-top:8px;padding:12px 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head><body>
<main><img src="/images/logo.webp" alt=""><h1>Sidan finns inte</h1><p>Nissen letade överallt men hittade inget på den här adressen. Länken kan vara gammal eller felstavad.</p><a href="/">Till Remissnissen</a></main>
</body></html>
